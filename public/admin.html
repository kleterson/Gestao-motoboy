<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador - Motoboy Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121212; color: #eee; min-height: 100vh; padding: 20px; }
        header { background: #1e1e1e; padding: 15px 20px; border-bottom: 3px solid #ff7300; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
        h1 { font-size: 20px; color: #ff7300; }
        .container { max-width: 950px; margin: 0 auto; }
        .table-box { background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #ff7300; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #333; font-size: 14px; }
        th { color: #ff7300; }
        
        .btn-renovar { background: #00e676; color: #121212; border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 5px; }
        .btn-renovar:hover { background: #00c853; }
        
        .btn-bloquear { background: #ff9d00; color: #121212; border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 5px; }
        .btn-bloquear:hover { background: #e08b00; }

        .btn-excluir { background: #ff4444; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-excluir:hover { background: #d32f2f; }

        .voltar { color: #aaa; text-decoration: none; font-size: 14px; background: #2a2a2a; padding: 6px 12px; border-radius: 6px; }
        
        #toast { position: fixed; top: 20px; right: 20px; background: #1e1e1e; border-left: 5px solid #00e676; color: #fff; padding: 15px; border-radius: 8px; display: none; z-index: 999; border-top: 1px solid #333; border-right: 1px solid #333; border-bottom: 1px solid #333; }
    </style>
</head>
<body>
    <div id="toast">Sucesso!</div>
    <div class="container">
        <header>
            <h1>👑 Painel Exclusivo do Administrador</h1>
            <a href="/" class="voltar">⬅️ Voltar ao Sistema</a>
        </header>

        <div class="table-box">
            <h2>Gerenciamento de Clientes e Assinaturas</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Expira em</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-usuarios">
                    <tr><td colspan="4" style="text-align: center; color: #888;">Carregando usuários...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function mostrarToast(mensagem) {
            const toast = document.getElementById('toast');
            toast.innerText = mensagem;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        async function carregarUsuariosAdmin() {
            const res = await fetch('/api/admin/usuarios');
            if (!res.ok) {
                alert('Acesso negado! Você precisa estar logado como administrador.');
                window.location.href = '/';
                return;
            }
            const usuarios = await res.json();
            const tbody = document.getElementById('tabela-usuarios');
            tbody.innerHTML = '';

            if (usuarios.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #888;">Nenhum usuário cadastrado.</td></tr>`;
                return;
            }

            usuarios.forEach(u => {
                const dataExp = new Date(u.data_expiracao).toLocaleDateString('pt-BR');
                tbody.innerHTML += `
                    <tr>
                        <td>${u.nome}</td>
                        <td>${u.email}</td>
                        <td>${dataExp}</td>
                        <td>
                            <button class="btn-renovar" onclick="renovar(${u.id})">➕ Renovar</button>
                            <button class="btn-bloquear" onclick="bloquear(${u.id})">🔒 Bloquear</button>
                            <button class="btn-excluir" onclick="excluir(${u.id})">🗑️ Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function renovar(id) {
            const res = await fetch(`/api/admin/renovar/${id}`, { method: 'POST' });
            const data = await res.json();
            mostrarToast(data.mensagem);
            carregarUsuariosAdmin();
        }

        async function bloquear(id) {
            if (confirm('Deseja realmente bloquear o acesso deste usuário?')) {
                const res = await fetch(`/api/admin/bloquear/${id}`, { method: 'POST' });
                const data = await res.json();
                mostrarToast(data.mensagem);
                carregarUsuariosAdmin();
            }
        }

        async function excluir(id) {
            if (confirm('Tem certeza que deseja excluir permanentemente este usuário?')) {
                const res = await fetch(`/api/admin/usuarios/${id}`, { method: 'DELETE' });
                const data = await res.json();
                mostrarToast(data.mensagem);
                carregarUsuariosAdmin();
            }
        }

        carregarUsuariosAdmin();
    </script>
</body>
</html>
